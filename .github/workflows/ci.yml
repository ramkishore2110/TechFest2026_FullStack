name: TechFest CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: techfest-react
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: techfest-react/package-lock.json
      - name: Install frontend dependencies
        run: npm install
      - name: Check frontend code
        run: npm run lint
      - name: Build frontend
        run: npm run build

  backend:
    name: Backend checks and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: techfest-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm install
      - name: Check backend syntax
        run: npm run check
      - name: Run backend tests
        run: npm test
